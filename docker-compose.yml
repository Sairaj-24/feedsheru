services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedsheru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedsheru}
      POSTGRES_DB: ${POSTGRES_DB:-feedsheru}
    volumes:
      - feedsheru_pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-feedsheru} -d ${POSTGRES_DB:-feedsheru}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — see .env.docker.example}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedsheru}:${POSTGRES_PASSWORD:-feedsheru}@db:5432/${POSTGRES_DB:-feedsheru}
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-feedsheru}:${POSTGRES_PASSWORD:-feedsheru}@db:5432/${POSTGRES_DB:-feedsheru}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-pg}
      NODE_ENV: production

volumes:
  feedsheru_pg:
